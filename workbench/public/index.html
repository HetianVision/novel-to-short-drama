<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eceded">
    <title>短剧制作工作台</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar report-header">
        <div class="brand-lockup">
          <div>
            <p class="eyebrow">LOCAL SHORT-DRAMA PIPELINE</p>
            <div class="brand-title-row">
              <h1>短剧制作工作台</h1>
              <span class="brand-rule" aria-hidden="true"></span>
              <span class="brand-subtitle">小说 · 资产 · 分镜 · 成片</span>
            </div>
          </div>
        </div>
        <div class="topbar-meta">
          <span class="connection-state">
            <svg class="icon icon-sm connection-dot" id="connectionDot" aria-hidden="true" focusable="false"><use href="/icons/iconsax.svg#timer-1"></use></svg>
            <span id="connectionLabel">正在连接本地服务</span>
          </span>
          <button class="ghost-button" id="refreshButton" type="button">
            <svg class="icon icon-sm" aria-hidden="true" focusable="false"><use href="/icons/iconsax.svg#refresh-2"></use></svg>
            <span>刷新状态</span>
          </button>
        </div>
      </header>
      <main class="app-root" id="appRoot" aria-live="polite"></main>
    </div>
    <div class="toast-region" id="toastRegion" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
