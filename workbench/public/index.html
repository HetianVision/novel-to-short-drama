<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eceded">
    <title>短剧制作工作台</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar report-header" id="appTopbar">
        <div class="brand-lockup" id="topbarBrand">
          <div>
            <p class="eyebrow">LOCAL SHORT-DRAMA PIPELINE</p>
            <div class="brand-title-row">
              <h1>短剧制作工作台</h1>
              <span class="brand-rule" aria-hidden="true"></span>
              <span class="brand-subtitle">小说 · 资产 · 分镜 · 成片</span>
            </div>
          </div>
        </div>
        <div class="workflow-topbar" id="workflowTopbar" hidden>
          <div class="workflow-topbar-project">
            <button class="workflow-project-back" data-go-home type="button" aria-label="返回项目首页">
              <svg class="icon icon-sm" aria-hidden="true" focusable="false"><use href="/icons/iconsax.svg#arrow-right-2"></use></svg>
            </button>
            <div>
              <p class="eyebrow">CURRENT PROJECT</p>
              <strong id="workflowTopbarProject">—</strong>
            </div>
          </div>
          <nav class="stage-nav topbar-stage-nav" id="workflowNav" aria-label="制作流程"></nav>
        </div>
        <div class="topbar-meta">
          <button class="quiet-button topbar-task-log" id="taskLogToggle" data-task-log-toggle type="button" aria-expanded="false" hidden>
            <svg class="icon icon-sm" aria-hidden="true" focusable="false"><use href="/icons/iconsax.svg#timer-1"></use></svg>
            <span>任务日志</span>
          </button>
          <span class="connection-state">
            <svg class="icon icon-sm connection-dot" id="connectionDot" aria-hidden="true" focusable="false"><use href="/icons/iconsax.svg#timer-1"></use></svg>
            <span id="connectionLabel">正在连接本地服务</span>
          </span>
          <button class="ghost-button" id="refreshButton" type="button">
            <svg class="icon icon-sm" aria-hidden="true" focusable="false"><use href="/icons/iconsax.svg#refresh-2"></use></svg>
            <span>刷新状态</span>
          </button>
        </div>
      </header>
      <main class="app-root" id="appRoot" aria-live="polite"></main>
    </div>
    <div class="toast-region" id="toastRegion" aria-live="polite"></div>
    <dialog class="project-dialog" id="newProjectDialog">
      <form id="newProjectForm">
        <div class="dialog-heading"><p class="eyebrow">NEW PROJECT</p><h2>新建项目</h2><p>先上传小说或资料，工作流才能读取并生成后续成果物。</p></div>
        <label class="field-label" for="projectTitleInput">项目名称<input id="projectTitleInput" name="title" type="text" required placeholder="例如：渡口"></label>
        <label class="dialog-upload-zone" for="sourceFileInput"><svg class="icon icon-md" aria-hidden="true" focusable="false"><use href="/icons/iconsax.svg#document-upload"></use></svg><span><strong>上传小说或资料</strong><small>TXT、Markdown、JSON 或其他文本资料</small></span><input id="sourceFileInput" name="source" type="file" required accept=".txt,.md,.markdown,.json,text/plain,text/markdown,application/json"></label>
        <p class="dialog-error" id="newProjectError" role="alert"></p>
        <div class="dialog-actions"><button class="quiet-button" data-dialog-close type="button">取消</button><button class="primary-button" id="createProjectSubmit" type="submit"><svg class="icon icon-sm" aria-hidden="true" focusable="false"><use href="/icons/iconsax.svg#folder-add"></use></svg><span>创建项目</span></button></div>
      </form>
    </dialog>
    <script type="module" src="/app.js"></script>
  </body>
</html>
