name: selftest

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 只在 macOS 上人工验过；CI 顺便盯住 Linux 和最低 Node 版本
        os: [ubuntu-latest, macos-latest]
        node: [18, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 自动发现所有 skill 的自测，新增 skill 不用改这个文件
      - name: 跑每个 skill 的自测
        run: |
          found=0
          for f in skills/*/scripts/selftest.mjs; do
            [ -f "$f" ] || continue
            echo "── $f"
            node "$f"
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "没找到任何 selftest.mjs —— 每个 skill 都应该有一个" >&2
            exit 1
          fi
          echo "共跑了 $found 个 skill 的自测"

      - name: 每个 skill 都要有 SKILL.md
        run: |
          for d in skills/*/; do
            test -f "$d/SKILL.md" || { echo "$d 缺 SKILL.md" >&2; exit 1; }
          done

      - name: install.sh 语法检查
        run: bash -n scripts/install.sh
